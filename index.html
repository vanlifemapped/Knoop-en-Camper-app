<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knoop & Camper</title>
    <!-- Leaflet Kaart CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: white; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        
        /* GPX Upload Knop Styling */
        .upload-btn { background: #0284c7; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; }
        .upload-btn:hover { background: #0369a1; }
        #gpx-file { display: none; }

        #map { flex: 1; width: 100%; }
        
        .stats-bar { background: #1e293b; padding: 12px; display: flex; justify-content: space-around; font-weight: bold; border-top: 1px solid #334155; }
        .stat-item { text-align: center; }
        .stat-val { color: #22c55e; font-size: 1.2rem; display: block; }
        
        /* Knooppunten Styling */
        .node-icon { background: #38bdf8; border: 2px solid white; color: black; font-weight: bold; border-radius: 50%; text-align: center; line-height: 24px; font-size: 11px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .node-icon.visited { background: #22c55e; color: white; box-shadow: 0 0 12px rgba(34, 197, 94, 0.9); }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1>🚴 Knoop & Camper</h1>
        <label for="gpx-file" class="upload-btn">
            📂 Upload GPX
        </label>
        <input type="file" id="gpx-file" accept=".gpx" />
    </header>
    
    <div id="map"></div>

    <div class="stats-bar">
        <div class="stat-item">
            <span id="visited-count" class="stat-val">0</span>
            Knooppunten
        </div>
        <div class="stat-item">
            <span id="camper-count" class="stat-val">0</span>
            Camperplekken
        </div>
    </div>
</div>

<!-- Leaflet & GPX Parser Bibliotheken -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    // 1. Initialiseer de kaart
    const map = L.map('map').setView([52.1326, 5.2913], 9);

    // 2. CartoDB Dark Mode Kaartstijl
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CARTO',
        maxZoom: 19
    }).addTo(map);

    // Voorbeeld Knooppunten (Later koppelen we de volledige landelijke database)
    let nodes = [
        { id: "81", lat: 52.15, lng: 5.38, visited: false, marker: null },
        { id: "82", lat: 52.17, lng: 5.42, visited: false, marker: null },
        { id: "83", lat: 52.12, lng: 5.35, visited: false, marker: null }
    ];

    let visitedCount = 0;
    let camperCount = 0;

    // Knooppunten op de kaart tekenen
    nodes.forEach(node => {
        let icon = L.divIcon({
            className: 'node-icon',
            html: node.id,
            iconSize: [28, 28]
        });

        let marker = L.marker([node.lat, node.lng], { icon: icon }).addTo(map);
        node.marker = marker;
        
        // Handmatig afvinken via tikken/klikken
        marker.on('click', function() {
            toggleNode(node);
        });
    });

    function toggleNode(node) {
        node.visited = !node.visited;
        if(node.visited) {
            node.marker.getElement().classList.add('visited');
            visitedCount++;
        } else {
            node.marker.getElement().classList.remove('visited');
            visitedCount--;
        }
        document.getElementById('visited-count').innerText = visitedCount;
    }

    // Camperplaats toevoegen via een lange druk / rechtermuisknop
    map.on('contextmenu', function(e) {
        L.marker(e.latlng, {
            icon: L.divIcon({
                html: '🚐',
                className: 'camper-pin',
                iconSize: [30, 30]
            })
        }).addTo(map).bindPopup("<b>Camperplaats</b><br>Toegevoegd op " + new Date().toLocaleDateString('nl-NL')).openPopup();

        camperCount++;
        document.getElementById('camper-count').innerText = camperCount;
    });

    // 3. GPX Bestand Verwerken
    document.getElementById('gpx-file').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let gpxData = e.target.result;
            
            // Teken de GPX route als een opvallende gekleurde lijn op de kaart
            new L.GPX(gpxData, {
                async: true,
                polyline_options: {
                    color: '#38bdf8',
                    opacity: 0.8,
                    weight: 5,
                    lineCap: 'round'
                },
                marker_options: { startIconUrl: null, endIconUrl: null, wptIconUrls: null }
            }).on('loaded', function(e) {
                map.fitBounds(e.target.getBounds());
                alert('🎉 GPX Route succesvol ingeladen!');
            }).addTo(map);
        };
        reader.readAsText(file);
    });
</script>
</body>
